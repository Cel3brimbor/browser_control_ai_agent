<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h3>Productivity AI Agent</h3>

    <label>GCP Project ID:</label>
    <input id="projectId" placeholder="project-id">

    <label>Location:</label>
    <input id="location" placeholder="us-central1" value="us-central1">

    <label>Model:</label>
    <input id="model" placeholder="google/gemini-2.0-flash-001" value="google/gemini-2.0-flash-001">

    <button id="saveGeminiConfig">Save Config</button>
    <p id="authStatus">Auth: Not checked</p>

    <hr>

    <h4>Explicit Block</h4>
    <input id="blockInput" placeholder="https://bad.com">
    <button id="addBlock">Block</button>
    <ul id="blockList"></ul>

    <h4>Whitelist (Always Allow)</h4>
    <input id="whiteInput" placeholder="https://good.com">
    <button id="addWhite">Whitelist</button>
    <ul id="whiteList"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
